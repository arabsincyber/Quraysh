name: 🧪 الاختبارات

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: 📥 جلب الكود
        uses: actions/checkout@v4

      - name: 🐍 تجهيز Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 تثبيت pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: 🧪 تشغيل الاختبارات
        run: pytest tests/ -v
